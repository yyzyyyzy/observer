# Prometheus 配置文件
# 采集 Observer Agent 的 eBPF 可观测性指标

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s
  external_labels:
    cluster: 'observer'

# 告警规则文件
rule_files:
  - "alerts.yml"

# Alertmanager 配置（按需修改地址）
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - alertmanager:9093

# ── 采集配置 ──────────────────────────────────────────────────────────────────

scrape_configs:
  # Observer Agent — eBPF 流指标
  - job_name: 'observer-agent'
    static_configs:
      - targets: ['observer:8080']
        labels:
          instance: 'observer-agent'
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus 自身
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
