# Observer 告警规则
# 覆盖 TCP 连接质量、UDP 流超时、L7 错误率和系统健康等维度

groups:

  # ── TCP 连接质量告警 ──────────────────────────────────────────────────────
  - name: tcp_quality
    rules:

      # SYN RTT 过高（建连时延 P99 > 100ms）
      - alert: HighSynRTT
        expr: |
          histogram_quantile(0.99,
            rate(flow_syn_rtt_us_bucket[5m])
          ) > 100000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "TCP SYN RTT 过高"
          description: "P99 SYN RTT = {{ $value | humanizeDuration }}，建连延迟超过 100ms，可能存在网络拥塞或服务端负载过高。"

      # 数据层 RTT 过高（P99 > 200ms）
      - alert: HighDataRTT
        expr: |
          histogram_quantile(0.99,
            rate(flow_rtt_mean_us_bucket[5m])
          ) > 200000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "TCP 数据层 RTT 过高"
          description: "P99 数据 RTT = {{ $value | humanizeDuration }}，超过 200ms 阈值。"

      # 服务响应时延 SRT 过高（P99 > 500ms）
      - alert: HighServerResponseTime
        expr: |
          histogram_quantile(0.99,
            rate(flow_art_rtt_us_bucket{role="SERVER"}[5m])
          ) > 500000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "服务端响应时延 (SRT) 过高"
          description: "服务端 P99 响应时延 = {{ $value | humanizeDuration }}，超过 500ms。建议检查服务端处理逻辑。"

      # TCP 重传率过高（> 5%）
      - alert: HighTCPRetransRate
        expr: |
          rate(flow_retrans_tx_total[5m]) /
          (rate(flow_bytes_tx_total[5m]) + 1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TCP 重传率过高"
          description: "TCP 重传率 {{ $value | humanizePercentage }} > 5%，可能存在丢包或网络质量问题。"

      # RST 连接激增（每分钟 RST > 100 次）
      - alert: TCPRSTSpike
        expr: |
          rate(flow_destroy_reason_total{reason="RST"}[2m]) * 60 > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "TCP RST 连接异常激增"
          description: "每分钟 RST 连接数 = {{ $value }}，超过 100 次阈值，可能存在应用崩溃或端口不可达。"

  # ── 流缓存健康告警 ────────────────────────────────────────────────────────
  - name: flow_cache
    rules:

      # 流缓存接近上限（> 80%）
      - alert: FlowCacheNearCapacity
        expr: flow_cache_size / 65536 > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "TCP 流缓存使用率过高"
          description: "流缓存使用率 {{ $value | humanizePercentage }}，超过 80%。可能导致 LRU 驱逐丢失流数据。"

      # 流缓存驱逐速率过高（> 100/min）
      - alert: HighFlowEvictionRate
        expr: rate(flow_cache_evicted_total[5m]) * 60 > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "流缓存 LRU 驱逐过快"
          description: "每分钟 LRU 驱逐 {{ $value }} 条流，缓存容量不足，建议增大 max_flows 配置。"

  # ── L7 应用层告警 ─────────────────────────────────────────────────────────
  - name: l7_quality
    rules:

      # HTTP 错误率过高（5xx > 5%）
      - alert: HighHTTPServerErrorRate
        expr: |
          rate(l7_response_status_total{protocol="HTTP", status="2"}[5m]) /
          (rate(l7_response_status_total{protocol="HTTP"}[5m]) + 0.001) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx 错误率过高"
          description: "HTTP 服务端错误率 {{ $value | humanizePercentage }} > 5%。"

      # gRPC 错误率过高（非 OK 状态码 > 10%）
      - alert: HighGRPCErrorRate
        expr: |
          rate(l7_response_status_total{protocol="gRPC", status!="0"}[5m]) /
          (rate(l7_response_status_total{protocol="gRPC"}[5m]) + 0.001) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "gRPC 错误率过高"
          description: "gRPC 非 OK 响应率 {{ $value | humanizePercentage }} > 10%。"

      # DNS 解析失败率过高（NXDOMAIN/SERVFAIL > 20%）
      - alert: HighDNSErrorRate
        expr: |
          rate(l7_response_status_total{protocol="DNS", status!="0"}[5m]) /
          (rate(l7_response_status_total{protocol="DNS"}[5m]) + 0.001) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "DNS 解析失败率过高"
          description: "DNS 解析失败率 {{ $value | humanizePercentage }} > 20%。"

      # Kafka 生产/消费错误率过高
      - alert: HighKafkaErrorRate
        expr: |
          rate(l7_response_status_total{protocol="Kafka", status!="0"}[5m]) /
          (rate(l7_response_status_total{protocol="Kafka"}[5m]) + 0.001) > 0.05
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Kafka 消息错误率过高"
          description: "Kafka 操作错误率 {{ $value | humanizePercentage }} > 5%，请检查 Broker 状态。"

  # ── 系统健康告警 ──────────────────────────────────────────────────────────
  - name: system_health
    rules:

      # Observer Agent 不可达
      - alert: ObserverAgentDown
        expr: up{job="observer-agent"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Observer Agent 不可用"
          description: "Observer Agent {{ $labels.instance }} 已停止响应超过 1 分钟。"

      # ClickHouse 写入积压（批次大小过大）
      - alert: ClickHouseWriteBacklog
        expr: clickhouse_batch_pending_rows > 10000
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ClickHouse 写入积压"
          description: "待写入 ClickHouse 的行数 = {{ $value }}，超过 10000 行，可能存在 ClickHouse 连接问题。"
