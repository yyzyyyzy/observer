# Observer 配置文件
# eBPF 网络可观测性 Agent — ClickHouse l4/l7_flow_log + L7协议解析 + WASM插件 + 云标签注入

http:
  listen: ":8080"
  metrics_path: "/metrics"
  health_path: "/health"

ebpf:
  ring_buf_size: 4194304      # 4MB ring buffer（loopback 高频流量需要更大 buffer）
  max_flows: 65536
  sampling_rate: 100
  enable_btf: true
  bpf_obj_dir: "./bpf"

collector:
  tcp:
    enabled: true
  udp:
    enabled: true
  tc:
    enabled: true             # TC hook：捕获完整 L3/L4 包头
    interfaces:               # 监听接口（对齐 DeepFlow tap_interface_regex）
      - "ens33"               # 主网卡（根据 ip a 输出：192.168.254.134）
      # 说明：loopback(lo) 流量通过 tcp_sendmsg/tcp_recvmsg kprobe 捕获，
      # TC hook 主要用于捕获 ens33/eth0 等外部接口流量的完整包头

# ──────────────────────────────────────────────────────────
# ClickHouse 存储（对齐 DeepFlow l4_flow_log / l7_flow_log）
# ──────────────────────────────────────────────────────────
clickhouse:
  enabled: true
  addresses:
    - "127.0.0.1:9000"
  database: "flow_metrics"
  username: "observer"
  password: "observer123"
  # L4 批写入配置
  l4_batch_size: 200          # 降低批大小，减少延迟，便于调试
  l4_flush_interval: 3s
  l4_retention_days: 7
  # L7 批写入配置
  l7_batch_size: 200          # 降低批大小，loopback 流量触发频繁
  l7_flush_interval: 3s
  l7_retention_days: 3
  # 连接池
  max_open_conns: 10
  max_idle_conns: 5
  dial_timeout: 10s

# ──────────────────────────────────────────────────────────
# L7 协议解析（支持 HTTP/MySQL/Redis/DNS/Kafka/gRPC）
# ──────────────────────────────────────────────────────────
l7:
  enabled: true
  max_payload_size: 4096      # 对应 BPF MAX_PAYLOAD_SIZE
  # ── 端口黑名单（BPF 层 + Go 层双重过滤）──────────────────────────────────
  # 对齐 DeepFlow l7_skip_port_set 最佳实践：
  #   - 加密协议端口（SSH:22）：payload 已加密，任何明文 parser 均无法识别
  #   - Agent 自身服务端口（:8080 metrics、:9000 ClickHouse、:9090 Prometheus）
  #   - 图形/远程桌面端口（VNC:5900-5990、RDP:3389）
  # 留空时使用内置默认黑名单（config.DefaultSkipPorts），
  # 并自动追加 http.listen 解析出的 Agent 自身端口。
  skip_ports:
    - 22      # SSH：加密流量，parser 全部不命中
    - 2222    # 备用 SSH
    - 3389    # RDP
    - 5900    # VNC
    - 5901
    - 5902
    - 5990    # VNC 变体（见日志 dport:5990 无 parser 匹配）
    - 8080    # Observer Agent HTTP（自身 metrics/health 端口）
    - 9000    # ClickHouse native protocol（自身存储端口）
    - 9090    # Prometheus / Grafana（见日志 dport:9090 噪声）
    - 9100    # node_exporter
  protocols:
    http:
      enabled: true           # HTTP/1.1（捕获 GET/POST 等请求，含 loopback）
    mysql:
      enabled: true
    redis:
      enabled: true
    dns:
      enabled: true
    kafka:
      enabled: false          # 按需开启
    grpc:
      enabled: false          # 按需开启

wasm:
  enabled: false
  plugin_dir: "./plugins"

cloud_meta:
  enabled: false              # 无 K8s 环境设为 false（pod_ip 写入 0.0.0.0）
  provider: "kubernetes"
  kubernetes:
    in_cluster: true
    inject_pod_labels: true
    inject_namespace: true
    inject_node_name: true

metrics:
  enable_histograms: true
  stats_window: 60            # Flush 周期（秒），tcpCache.Flush() 调用间隔

log:
  level: "debug"              # 调试时使用 debug，生产改为 info
  format: "json"
  output: "stdout"

advanced:
  debug: false
  pprof_port: 6060
  connection_gc_interval: 300
  stats_interval: 60
